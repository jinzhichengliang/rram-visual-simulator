name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          cd apps/api
          python -m pytest ../../tests/unit -v
      - name: Run schema tests
        run: |
          cd apps/api
          python -m pytest ../../tests/unit/test_directory_structure.py -v
      - name: Lint
        run: |
          cd apps/api
          pip install ruff
          python -m ruff check ../../simulator ../../validation ../../tests || true

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci
      - name: Type check
        run: |
          cd apps/web
          npx tsc --noEmit
      - name: Run tests
        run: |
          cd apps/web
          npm run test -- --run
      - name: Lint
        run: |
          cd apps/web
          npm run lint || true

  ci-smoke:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-tests]
    steps:
      - name: CI Smoke Pass
        run: echo "All CI checks passed."
